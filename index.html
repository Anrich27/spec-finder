<style>
/* Layout: one column, sticky search bar on top, answer cards below. System fonts only so the page works with no signal. */
:root{
  --bg:#eceef0; --surface:#ffffff; --sunk:#e3e6ea; --ink:#16181a; --muted:#59616a; --line:#cfd5da;
  --band:#c1122b; --on-band:#ffffff; --accent:#b01028; --steel:#262a2e; --on-steel:#f1f3f4; --hit:#fff1d6;
  --f-display:"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121416; --surface:#1b1e21; --sunk:#262a2e; --ink:#eceef0; --muted:#9ca4ac; --line:#353a40;
    --band:#b5112a; --on-band:#ffffff; --accent:#ff7a8a; --steel:#0a0b0c; --on-steel:#eceef0; --hit:#3a2e14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121416; --surface:#1b1e21; --sunk:#262a2e; --ink:#eceef0; --muted:#9ca4ac; --line:#353a40;
  --band:#b5112a; --on-band:#ffffff; --accent:#ff7a8a; --steel:#0a0b0c; --on-steel:#eceef0; --hit:#3a2e14; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);color:var(--on-steel);padding-inline:16px;padding-block:12px 10px;border-bottom:4px solid var(--band)}
.top-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;font-stretch:condensed}
.brand span{font-size:12px;opacity:.75;letter-spacing:.06em;text-transform:uppercase;text-align:right}
.box{display:flex;align-items:center;background:var(--surface);border-radius:6px;padding-inline:12px;gap:8px}
.box svg{flex:none;width:20px;height:20px;stroke:var(--muted)}
#q{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-size:18px;padding-block:12px;outline:none}
#q::placeholder{color:var(--muted)}
#q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
@media (max-width:520px){.brand span{display:none}}
#clear{border:0;background:none;color:var(--muted);font-size:14px;padding:6px 4px}
.ranges{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.ranges::-webkit-scrollbar{display:none}
.rchip{flex:none;border:1.5px solid rgba(255,255,255,.28);background:none;color:var(--on-steel);border-radius:20px;padding:5px 12px;font-size:14px}
.rchip[aria-pressed="true"]{background:var(--band);border-color:var(--band)}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.status{color:var(--muted);font-size:14px}
.label{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 11px;font-size:15px;font-weight:500}
.chip small{color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);min-width:0}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 14px 0}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card h2{font-size:19px;font-weight:650;line-height:1.25;padding:2px 14px 10px;text-wrap:balance}
.ans{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ans-row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.ans-row:last-child{border-bottom:0}
.ans-row .m{font-weight:600;font-size:15px}
.ans-row .v{font-size:20px;font-weight:700;color:var(--accent);overflow-wrap:anywhere;line-height:1.25}
.ans-row .v.long{font-size:16px;font-weight:600;color:var(--ink)}
.others{border-top:1px solid var(--line);padding:8px 14px 10px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.others b{color:var(--ink);font-weight:600}
.src{font-size:12px;color:var(--muted);padding:0 14px 10px}
.band{background:var(--band);color:var(--on-band);font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.band h2{font-size:22px;padding:0;font-weight:800}
.band span{font-size:13px;font-weight:600;opacity:.9;text-align:right}
.sec{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--sunk);padding:7px 14px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;overflow-wrap:anywhere}
.kv.hit{background:var(--hit)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px 14px 14px}
.mbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 12px;text-align:left;font-weight:600;font-size:15px}
.mbtn small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:8px}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:64ch}
.back{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
@media (min-width:600px){.ans-row{grid-template-columns:minmax(0,12em) minmax(0,1fr)}}
</style>

function search(q,range){
  const all=tokens(q);if(!all.length)return null;
  const res=searchT(all,range);
  if((res.cards&&res.cards.length)||res.sheets||res.picker)return res;
  const tk=all.filter(known),skipped=all.filter(t=>!known(t));

  const r2=searchT(tk,range);r2.skipped=skipped;return r2;

function searchT(tk,range){
  const alts=tk.map(t=>({p:t,x:SYN[t]||[]}));
  const tables=D.filter(t=>range==='all'||t.r===range);
  const sheets=[],cards=[];
  for(const t of tables){
    // which tokens each model covers by name / range
    const mh=t.models.map((m,i)=>alts.map(a=>hits(a,t.mWords[i])||hits(a,t.rangeWords)));
    const named=t.models.map((m,i)=>alts.some((a,k)=>hits(a,t.mWords[i])&&!hits(a,t.rangeWords)));
    // model-only query → sheet
    t.models.forEach((m,i)=>{if(mh[i].every(Boolean)&&(named[i]||tk.length===alts.filter((a,k)=>hits(a,t.rangeWords)).length))sheets.push({t,i,named:named[i]})});
    t.rows.forEach((r,ri)=>{
      const lh=alts.map(a=>hits(a,r.lw)),sh=alts.map(a=>hits(a,r.sw));
      const anyRow=lh.some(Boolean)||sh.some(Boolean);
      const ms=[];let best=0;
      t.models.forEach((m,i)=>{
        if(!valOf(r,i))return;
        let sc=0,ok=true,rowTok=false;
        alts.forEach((a,k)=>{
          if(lh[k]){sc+=4;rowTok=true}else if(sh[k]){sc+=2;rowTok=true}
          else if(mh[i][k]){sc+=3}
          else if(hits(a,r.vw[i])){sc+=1;rowTok=true}
          else ok=false;
        });
        if(ok&&rowTok){ms.push(i);if(sc>best)best=sc}
      });
      if(ms.length){
        const anyNamed=ms.some(i=>named[i]);
        const focus=anyNamed?ms.filter(i=>named[i]):ms;
        const lead=r.lw.length?2*lh.filter(Boolean).length/r.lw.length:0;
        cards.push({t,r,ri,focus,score:best+lead+(anyNamed?2:0)+(anyRow?1:0)});
      }
    });
  }
  // when the query only names models, show their sheets instead of every row that mentions them
  const namedSheets=sheets.filter(s=>s.named);
  if(namedSheets.length&&!cards.some(c=>c.r.lw.length&&alts.some(a=>hits(a,c.r.lw)||hits(a,c.r.sw)))){
    return {sheets:namedSheets,cards:[]};
  }
  if(sheets.length&&!cards.length)return {picker:sheets};
  cards.sort((a,b)=>b.score-a.score||D.indexOf(a.t)-D.indexOf(b.t)||a.ri-b.ri);
  return {cards:cards.slice(0,40),total:cards.length};
}

  let body='';
  if(single){
    body=`<div class="ans"><div class="ans-row"><span class="m">${esc(focus.length===t.models.length||focus.length>2?'All models':focus.map(i=>t.models[i][0]).join(', '))}</span><span class="v${isLong(r[2])?' long':''}">${esc(r[2])}</span></div></div>`;
  }else{
    body=`<div class="ans">${focus.map(i=>`<div class="ans-row"><span class="m">${esc(t.models[i][0])}</span><span class="v${isLong(valOf(r,i))?' long':''}">${esc(valOf(r,i))}</span></div>`).join('')}</div>`;
    const rest=all.filter(i=>!focus.includes(i));
    if(rest.length)body+=`<div class="others">${rest.map(i=>`<span>${esc(short(t.models[i][0]))}: <b>${esc(valOf(r,i))}</b></span>`).join('')}</div>`;
  }
  return `<article class="card"><div class="card-h"><span class="eyebrow">${esc(t.name)} · ${esc(r[0])}</span></div><h2>${esc(r[1])}</h2>${body}<div class="src">Source: ${esc(t.src)}</div></article>`;
}
function sheetHTML(t,i,hl){
  const secs=[];t.rows.forEach(r=>{const v=valOf(r,i);if(!v)return;let s=secs.find(x=>x.n===r[0]);if(!s)secs.push(s={n:r[0],rows:[]});s.rows.push([r[1],v])});
  return `<article class="card"><div class="band"><h2>${esc(t.models[i][0])}</h2><span>${esc(t.name)}</span></div>
   ${secs.map(s=>`<div class="sec">${esc(s.n)}</div>${s.rows.map(x=>`<div class="kv"><span class="k">${esc(x[0])}</span><span class="v">${esc(x[1])}</span></div>`).join('')}`).join('')}
   <div class="src" style="padding-top:10px">Source: ${esc(t.src)}</div></article>`;
}
function browseHTML(){
  const recent=prefs.recent.length?`<div class="label">Recent</div><div class="chips">${prefs.recent.map(r=>`<button class="chip" data-q="${esc(r)}">${esc(r)}</button>`).join('')}</div>`:'';
  const tabs=D.filter(t=>St.range==='all'||t.r===St.range);
  return `${recent}<div class="label">Quick look-ups</div><div class="chips">${QUICK.map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
   <div class="label">Browse models</div>
   ${tabs.map(t=>`<section class="card"><div class="band"><h2>${esc(t.name)}</h2><span>${t.models.length} models</span></div><div class="mlist">${t.models.map(m=>`<button class="mbtn" data-q="${esc(m[0])}">${esc(m[0])}<small>${esc(valOf(t.rows[0],t.models.indexOf(m)))}</small></button>`).join('')}</div></section>`).join('')}
   <div class="foot"><p>Everything on this page is stored inside it, so search keeps working with no signal once the page is open.</p><p>Figures come from Case IH worldwide brochures. Where local stock or a newer brochure differs, the local figure wins.</p></div>`;
}
function render(){
  const out=$('out');$('clear').hidden=!St.q;
  if(!St.q.trim()){out.innerHTML=browseHTML();return}
  const res=search(St.q,St.range);
  if(!res){out.innerHTML=browseHTML();return}
  const skip=res.skipped?`<p class="status">No match for “${esc(res.skipped.join(' '))}”, so it was left out.</p>`:'';
  if(res.sheets){out.innerHTML=skip+res.sheets.slice(0,3).map(s=>sheetHTML(s.t,s.i)).join('')+(res.sheets.length>3?`<p class="status">${res.sheets.length-3} more models match. Add the model number to narrow it down.</p>`:'');return}
  if(res.picker){out.innerHTML=`<p class="status">Pick a model, or add a spec such as “lift” or “fuel”.</p><section class="card"><div class="mlist">${res.picker.map(s=>`<button class="mbtn" data-q="${esc(s.t.models[s.i][0])}">${esc(s.t.models[s.i][0])}<small>${esc(s.t.name)}</small></button>`).join('')}</div></section>`;return}
  if(!res.cards.length){out.innerHTML=`<div class="empty"><strong>Nothing found for “${esc(St.q)}”.</strong><span class="status">Try a model and a spec, such as “magnum 340 lift”, “puma fuel” or “8260 grain tank”. You can also tap a model under Browse.</span><button class="back" data-q="">Back to browse</button></div>`;return}
  out.innerHTML=skip+`<p class="status">${res.total} answer${res.total===1?'':'s'}${res.total>40?', showing the best 40':''}</p>`+res.cards.map(cardHTML).join('');
}
let tRecent=null;
function setQ(q,push){
  St.q=q;$('q').value=q;render();
  clearTimeout(tRecent);
  if(q.trim())tRecent=setTimeout(()=>{const v=q.trim();prefs.recent=[v,...prefs.recent.filter(x=>x.toLowerCase()!==v.toLowerCase())].slice(0,6);savePrefs(prefs)},1500);
  if(push)try{window.scrollTo({top:0})}catch(e){}
}
function boot(){
  $('ranges').innerHTML=[{id:'all',n:'All'},...RANGES].map(r=>`<button class="rchip" data-r="${r.id}" aria-pressed="${St.range===r.id}">${esc(r.n)}</button>`).join('');
  $('ranges').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;St.range=b.dataset.r;document.querySelectorAll('.rchip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.r===St.range)));render()});
  $('q').addEventListener('input',e=>setQ(e.target.value));
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.blur()}});
  $('clear').addEventListener('click',()=>{setQ('');$('q').focus()});
  $('out').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;setQ(b.dataset.q,true)});
  render();
}
if(typeof globalThis!=='undefined')globalThis.__finder={D,search};
if(typeof document!=='undefined')boot();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
